version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      # Load from .env file
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - DOC_SOURCE_DIR=${DOC_SOURCE_DIR}
    volumes:
      # Optional: Mount documents directory for persistence
      - ./documents:/app/documents
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend is now bundled in the backend container via the single Dockerfile
  # Removing the separate frontend service to avoid conflict

networks:
  rag-network:
    driver: bridge
